[bot]
dry_run = true              # set false for live trading
log_level = "info"          # trace | debug | info | warn | error

[binance]
ws_url = "wss://stream.binance.com/stream"
rest_url = "https://api.binance.com"
kline_buffer_size = 500
streams = ["btcusdt@kline_1m", "btcusdt@kline_5m", "ethusdt@kline_5m", "ethusdt@kline_1m"]

[gamma]
base_url = "https://gamma-api.polymarket.com"
refresh_interval_secs = 60          # how often to re-query for the current cycle
min_volume_24h = 1000.0             # USDC minimum (rolling markets start fresh each cycle)
interval_secs = [300, 900]          # 5-min and 15-min cycles
min_entry_secs = 60                 # skip current market if < 60 s remain; pre-fetch next

[polygon]
rpc_url = "wss://polygon-bor-rpc.publicnode.com"
usdc_address = "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174"
balance_cache_secs = 30

[clob]
base_url = "https://clob.polymarket.com"
order_timeout_secs = 30
max_retries = 3
tick_size = "0.01"
maker_rebate_bps = 25       # 0.25% rebate for limit orders

[risk]
max_position_pct = 0.40     # max 40% balance per position
max_deployed_pct = 0.80     # max 80% balance deployed total
min_bet_usdc = 10.0
max_bet_usdc = 200.0
kelly_fraction = 0.50       # half-Kelly
kelly_window = 50           # rolling trade window
cold_start_pct = 0.05       # flat 5% until kelly window fills
initial_balance_usdc = 1000.0  # starting balance for kelly sizing / circuit breaker

[circuit_breaker]
max_drawdown = 0.15         # 15% from peak
max_consecutive_losses = 5
max_api_error_rate = 0.20
cooldown_minutes = 60

[volatility]
atr_min_pct = 0.15          # lower bound of optimal range
atr_max_pct = 0.80          # upper bound of optimal range

[signal]
confluence_threshold = 3.5  # out of max 7.0
cooldown_bars = 2           # min bars between entries
max_concurrent_positions = 3
reentry_cooldown_bars = 5

[telegram]
enabled = false
# bot_token = "YOUR_BOT_TOKEN"
# chat_id = "YOUR_CHAT_ID"

[claim]
enabled = true
check_interval_secs = 300       # poll for resolved markets every 5 min
min_claimable_usdc = 1.0        # skip tiny dust claims
use_relayer = true              # gasless relayer first, direct contract as fallback
ctf_address = "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045"
neg_risk_adapter = "0xd91E80cF2E7be2e162c6513ceD06f1dD0dA35296"
